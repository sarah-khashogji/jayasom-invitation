<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070A10">
<meta name="description" content="A New Constellation Begins — an evening at Jayasom, AMAALA. Sunday 13 September.">
<meta property="og:title" content="Jayasom · AMAALA">
<meta property="og:description" content="A New Constellation Begins — كوكبة جديدة تبدأ بالتألّق">
<meta property="og:type" content="website">
<title>Jayasom Constellation</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Questrial&family=Alexandria:wght@200;300;400&display=swap');

:root{
  --night-0:#070A10;
  --ivory:#F6EDE7;
  --white:#FFFFFF;
  --sand:#CDA788;
  --star:#ECC681;

  --fs-hero:clamp(1.28rem,4.9vw,2.3rem);
  --fs-ar-hero:clamp(1rem,3.9vw,1.62rem);
  --fs-body:clamp(0.92rem,3.3vw,1.08rem);
  --fs-detail:clamp(0.78rem,2.8vw,0.93rem);
  --fs-label:clamp(0.58rem,2.1vw,0.67rem);
  --ls-hero:clamp(.18em,1.2vw,.30em);

  --ease:cubic-bezier(.19,1,.22,1);
  --ease-soft:cubic-bezier(.4,0,.2,1);

  --lat:'Century Gothic','Questrial','Futura','Avenir Next',-apple-system,sans-serif;
  --ar:'Alexandria','Century Gothic',sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

body{
  background:var(--night-0);
  color:var(--ivory);
  font-family:var(--lat);
  font-weight:400;
  min-height:100svh;
  overflow:hidden;
  position:relative;
}

/* ---------- sky ---------- */
#sky{
  position:fixed;inset:0;width:100%;height:100%;
  display:block;z-index:0;
  opacity:0;transition:opacity 2.4s var(--ease-soft);
  background:
    radial-gradient(150% 92% at 50% 6%, #16202F 0%, #0C121C 42%, #070A10 78%),
    var(--night-0);
}
#sky.lit{opacity:1}

.vignette{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(120% 78% at 50% 42%, transparent 38%, rgba(4,6,10,.55) 82%, rgba(3,4,8,.86) 100%);
}

/* ---------- stage system ----------
   Each stage owns the whole viewport and scrolls inside itself, so a stage
   that outgrows a short phone screen stays reachable instead of being clipped.
   margin:auto on the inner wrapper centres short content without the
   flex-centring overflow bug (which would cut off the top). */
.stages{position:fixed;inset:0;z-index:3}
.stage{
  position:absolute;inset:0;
  display:flex;
  overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  opacity:0;visibility:hidden;
  transition:opacity .95s var(--ease-soft), transform 1.1s var(--ease), visibility 0s linear .95s;
  pointer-events:none;
  transform:translateY(10px);
}
.stage::-webkit-scrollbar{width:0;height:0}
.stage{scrollbar-width:none}
.stage.on{opacity:1;visibility:visible;transform:none;pointer-events:auto;transition-delay:0s}
.stage.out{transform:translateY(-16px)}
.wrap{
  margin:auto;
  width:100%;max-width:42rem;
  padding:clamp(1.8rem,4.4svh,2.5rem) 1.5rem clamp(1.6rem,3.8svh,2.2rem);
  display:flex;flex-direction:column;align-items:center;
  text-align:center;
}

/* ---------- constellation / logo ---------- */
.mark{
  width:min(76vw,29rem);
  margin-bottom:clamp(1rem,3.2svh,1.6rem);
  overflow:visible;
  transform-origin:50% 50%;
}
.sk-line{
  fill:none;stroke:var(--ivory);stroke-width:.55;
  stroke-linecap:round;opacity:.72;
  stroke-dasharray:var(--len);stroke-dashoffset:var(--len);
  transition:stroke-dashoffset .68s var(--ease-soft), opacity .9s ease;
}
.sk-line.drawn{stroke-dashoffset:0}
.sk-halo{fill:var(--star);opacity:0;transition:opacity .8s ease}
.sk-core{fill:var(--white);opacity:0;transition:opacity .55s ease}
.sk-node.lit .sk-halo{opacity:.17}
.sk-node.lit .sk-core{opacity:.95}
.skeleton{opacity:1;transition:opacity 1.15s var(--ease-soft)}
.skeleton.faded{opacity:.2}
.mk-jayasom{fill:var(--ivory)}
.mk-amaala{fill:var(--sand)}
.realmark{opacity:0;transition:opacity 1.25s var(--ease-soft)}
.realmark.shown{opacity:1}

/* ---------- reveal items ---------- */
.rv{opacity:0;transform:translateY(14px);
  transition:opacity 1.05s var(--ease-soft), transform 1.15s var(--ease)}
.rv.in{opacity:1;transform:none}

/* every word arrives on its own — the opening is read, not displayed */
.w{
  display:inline-block;
  opacity:0;transform:translateY(.5em);
  transition:opacity 1.15s var(--ease-soft), transform 1.25s var(--ease);
}
.w.in{opacity:1;transform:none}

/* ---------- typography ---------- */
.hero{
  font-size:var(--fs-hero);
  font-weight:400;
  letter-spacing:var(--ls-hero);
  text-transform:uppercase;
  line-height:1.42;
  text-indent:var(--ls-hero);
  color:var(--ivory);
}
.hero-ar{
  font-family:var(--ar);
  font-size:var(--fs-ar-hero);
  font-weight:200;
  line-height:1.8;
  color:var(--sand);
  margin-top:.78rem;
  direction:rtl;
}
[dir="rtl"] .hero{
  font-family:var(--ar);
  letter-spacing:0;text-indent:0;text-transform:none;
  font-weight:200;
  font-size:var(--fs-ar-hero);
  color:var(--ivory);
}
[dir="rtl"] .hero-ar{
  font-family:var(--lat);
  direction:ltr;
  letter-spacing:.28em;text-indent:.28em;text-transform:uppercase;
  font-size:clamp(.72rem,2.6vw,.86rem);
  font-weight:400;
}

/* When / where / what to wear are one family — the dress code is named,
   not shrunk, and uses the same middot separator as the lines above it. */
.detail.dress{
  display:flex;flex-direction:column;align-items:center;
  gap:.3rem;
  margin-top:.5rem;
}
.d-lab{color:var(--sand)}

.rule{
  width:1px;height:clamp(1.1rem,2.4svh,1.5rem);
  background:linear-gradient(to bottom,transparent,rgba(205,167,136,.5),transparent);
  margin:clamp(.8rem,2.2svh,1.15rem) 0;
}

.verse{
  font-size:var(--fs-body);
  font-weight:400;
  line-height:1.95;
  letter-spacing:.055em;
  color:rgba(246,237,231,.9);
  max-width:26rem;
}
[dir="rtl"] .verse{font-family:var(--ar);font-weight:200;letter-spacing:0;line-height:2.2}

.details{
  margin-top:clamp(1.1rem,3.2svh,1.6rem);
  display:flex;flex-direction:column;gap:.55rem;
}
.detail{
  font-size:var(--fs-detail);
  letter-spacing:.2em;
  text-transform:uppercase;
  color:rgba(246,237,231,.72);
  font-weight:400;
}
.detail.key{color:var(--ivory);letter-spacing:.24em}
[dir="rtl"] .detail{font-family:var(--ar);letter-spacing:0;text-transform:none;font-weight:200;font-size:var(--fs-body)}

.note{
  margin-top:.95rem;
  font-size:var(--fs-label);
  letter-spacing:.26em;
  text-transform:uppercase;
  color:rgba(205,167,136,.84);
}
[dir="rtl"] .note{font-family:var(--ar);letter-spacing:0;text-transform:none;font-size:var(--fs-detail);font-weight:200}

/* ---------- countdown ---------- */
.countdown{
  margin-top:clamp(1.1rem,3.2svh,1.6rem);
  display:flex;align-items:flex-end;gap:clamp(1.1rem,4.6vw,1.8rem);
}
.cd-unit{display:flex;flex-direction:column;align-items:center;gap:.42rem}
.cd-num{
  font-size:clamp(1.02rem,3.7vw,1.24rem);
  letter-spacing:.14em;
  color:var(--star);
  font-variant-numeric:tabular-nums;
  text-shadow:0 0 14px rgba(236,198,129,.34);
}
.cd-lab{
  font-size:.6rem;letter-spacing:.28em;text-transform:uppercase;
  color:rgba(246,237,231,.6);
}
[dir="rtl"] .cd-lab{font-family:var(--ar);letter-spacing:0;text-transform:none;font-size:.66rem}
.cd-dot{width:2px;height:2px;border-radius:50%;background:rgba(205,167,136,.4);margin-bottom:1.1rem}

/* ---------- button ---------- */
.cta{
  margin-top:clamp(1.2rem,3.6svh,1.8rem);
  position:relative;
  background:none;border:0;
  color:var(--ivory);
  font-family:inherit;
  font-size:var(--fs-detail);
  letter-spacing:.32em;text-transform:uppercase;
  text-indent:.32em;
  padding:1.05rem 0 .95rem;
  cursor:pointer;
  transition:color .5s ease, letter-spacing .7s var(--ease);
}
[dir="rtl"] .cta{font-family:var(--ar);letter-spacing:0;text-indent:0;text-transform:none;font-weight:300;font-size:var(--fs-body)}
.cta::after{
  content:'';position:absolute;left:50%;bottom:0;
  width:100%;height:1px;transform:translateX(-50%) scaleX(.42);
  background:linear-gradient(to right,transparent,var(--sand),transparent);
  transition:transform .8s var(--ease),opacity .5s ease;
  opacity:.62;
}
.cta:hover,.cta:focus-visible{color:var(--white);letter-spacing:.38em}
[dir="rtl"] .cta:hover,[dir="rtl"] .cta:focus-visible{letter-spacing:.02em}
.cta:hover::after,.cta:focus-visible::after{transform:translateX(-50%) scaleX(1);opacity:1}
.cta:focus-visible{outline:1px solid rgba(236,198,129,.55);outline-offset:12px;border-radius:2px}

/* ---------- form ---------- */
.progress{margin-bottom:clamp(1.9rem,6svh,2.9rem);width:clamp(9rem,34vw,12rem);overflow:visible}
.pg-link{fill:none;stroke:var(--star);stroke-width:1;opacity:0;
  stroke-dasharray:var(--len);stroke-dashoffset:var(--len);
  transition:stroke-dashoffset 1.05s var(--ease-soft),opacity .7s ease}
.pg-link.drawn{opacity:.5;stroke-dashoffset:0}
.pg-halo{fill:var(--star);opacity:.04;transition:opacity .9s ease}
.pg-core{fill:rgba(246,237,231,.3);transition:fill .8s ease}
.pg-node.lit .pg-halo{opacity:.2}
.pg-node.lit .pg-core{fill:var(--white)}

@keyframes stepIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.field.enter .f-label,
.field.enter .f-input,
.field.enter .choices{animation:stepIn .7s var(--ease) both}
.field.enter .f-input{animation-delay:.09s}
.field.enter .choices{animation-delay:.14s}

.field{width:100%;max-width:min(17.5rem,80vw);display:flex;flex-direction:column;align-items:center}
.f-label{
  font-size:var(--fs-label);
  letter-spacing:.3em;text-transform:uppercase;
  color:rgba(205,167,136,.8);
  margin-bottom:1.5rem;
}
[dir="rtl"] .f-label{font-family:var(--ar);letter-spacing:0;text-transform:none;font-size:var(--fs-detail);font-weight:200}
.f-input{
  width:100%;
  background:none;border:0;border-bottom:1px solid rgba(246,237,231,.16);
  color:var(--ivory);
  font-family:inherit;
  font-size:clamp(1.02rem,4vw,1.22rem);
  letter-spacing:.08em;
  text-align:center;
  padding:.72rem .3rem .95rem;
  transition:border-color .6s ease;
}
[dir="rtl"] .f-input{font-family:var(--ar);letter-spacing:0;font-weight:200}
.f-input::placeholder{color:rgba(246,237,231,.2);letter-spacing:.12em}
.f-input:focus{outline:none;border-bottom-color:rgba(236,198,129,.62)}
.f-input:-webkit-autofill{-webkit-text-fill-color:var(--ivory);transition:background-color 9999s}

.f-err{
  min-height:1.3rem;margin-top:.85rem;
  font-size:var(--fs-label);letter-spacing:.18em;text-transform:uppercase;
  color:rgba(240,160,136,.9);
  opacity:0;transition:opacity .4s ease;
}
[dir="rtl"] .f-err{font-family:var(--ar);letter-spacing:0;text-transform:none;font-size:var(--fs-detail)}
.f-err.show{opacity:1}

.choices{display:flex;flex-direction:column;gap:.9rem;width:100%;max-width:22rem;margin-top:.4rem}
.choice{
  background:none;border:1px solid rgba(246,237,231,.14);
  color:rgba(246,237,231,.86);
  font-family:inherit;
  font-size:var(--fs-detail);
  letter-spacing:.2em;text-transform:uppercase;text-indent:.2em;
  padding:1.05rem 1.2rem;
  cursor:pointer;
  transition:border-color .5s ease,color .5s ease,background-color .5s ease,transform .5s var(--ease);
}
[dir="rtl"] .choice{font-family:var(--ar);letter-spacing:0;text-indent:0;text-transform:none;font-weight:200;font-size:var(--fs-body)}
.choice:hover,.choice:focus-visible{
  border-color:rgba(236,198,129,.5);color:var(--white);
  background:rgba(236,198,129,.05);transform:translateY(-2px);outline:none;
}
.choice:focus-visible{outline:1px solid rgba(236,198,129,.5);outline-offset:4px}

/* three columns so the primary action stays optically centred
   whether or not Back is present */
.f-nav{
  margin-top:1.7rem;width:100%;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
}
.f-nav>*{min-width:0}
.f-nav .f-back{grid-column:1;justify-self:end;margin-right:1.4rem}
/* on the choice step there is no Continue, so Back takes the centre */
.f-nav.solo .f-back{grid-column:2;justify-self:center;margin-right:0}
.f-nav .cta{grid-column:2}
.f-back{
  background:none;border:0;cursor:pointer;
  color:rgba(246,237,231,.34);
  font-family:inherit;font-size:var(--fs-label);
  letter-spacing:.24em;text-transform:uppercase;
  padding:.6rem .2rem;
  transition:color .45s ease;
}
[dir="rtl"] .f-back{font-family:var(--ar);letter-spacing:0;text-transform:none;font-size:var(--fs-detail)}
.f-back:hover,.f-back:focus-visible{color:rgba(246,237,231,.75);outline:none}
.f-back[hidden]{display:none}

/* ---------- closing ---------- */
.final-mark{width:min(56vw,15rem);margin-bottom:clamp(1.4rem,4.6svh,2.2rem);overflow:visible}

/* ---------- chrome ---------- */
.chrome{
  position:fixed;z-index:6;
  display:flex;align-items:center;gap:1.15rem;
  top:max(1.05rem,env(safe-area-inset-top));
  right:max(1.15rem,env(safe-area-inset-right));
  opacity:0;transition:opacity 1.4s var(--ease-soft) .4s;
}
.chrome.in{opacity:1}
[dir="rtl"] .chrome{right:auto;left:max(1.15rem,env(safe-area-inset-left));flex-direction:row-reverse}
[dir="rtl"] .skip{font-family:var(--ar);letter-spacing:0;text-transform:none;font-size:.72rem}
.skip{
  position:fixed;z-index:6;
  bottom:max(1.5rem,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  background:none;border:0;cursor:pointer;
  color:rgba(246,237,231,.46);
  font-family:var(--lat);
  font-size:.63rem;letter-spacing:.3em;text-transform:uppercase;
  padding:.95rem 1.2rem;min-height:44px;
  opacity:0;transition:opacity 1s ease,color .4s ease;
}
.skip.in{opacity:1}
.skip:hover,.skip:focus-visible{color:rgba(246,237,231,.72);outline:none}

.cursor-off{cursor:none}

/* short screens: drop the ornament before crowding the words */
@media (max-height:720px){
  .rule{display:none}
  .verse{line-height:1.8}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
}
</style>

</head>

const REACH = fine ? 86 : 116;      /* radius of the glow itself */
const NEAR2 = fine ? 24000 : 42000; /* how far it looks for a star to reach */

function seedStars() {
  const area = W * H;
  const n = Math.min(520, Math.max(180, Math.round(area / 2900)));

  for (let i = 0; i < n; i++) {
    const depth = Math.random();

      x: Math.random(), y: Math.random(),
      r: (0.34 + Math.random() * 1.05) * (0.55 + depth * 0.9),
      a: 0.16 + Math.random() * 0.6,
      ph: Math.random() * Math.PI * 2,
      sp: 0.16 + Math.random() * 0.5,
      p: 0.1 + depth * 0.6,
      warm: Math.random() < 0.24
    });
  }
}

function sizeCanvas() {

  W = cv.clientWidth; H = cv.clientHeight;

    x: fromLeft ? -0.06 * W : 1.06 * W,
    y: (0.05 + Math.random() * 0.22) * H,
    vx: (fromLeft ? 1 : -1) * (W * 0.0125),
    vy: H * 0.0052,
    life: 1
  });

let t0 = performance.now();

  const t = (now - t0) / 1000;
  cx.clearRect(0, 0, W, H);

  ptr.y += (ptr.ty - ptr.y) * 0.08;

  const py = ptr.active ? (ptr.y / H - 0.5) : 0;

      cx.fillStyle = 'rgba(236,198,129,' + (a * 0.05).toFixed(3) + ')';

      const dx = x - ptr.x, dy = y - ptr.y;
      const d2 = dx * dx + dy * dy;

  requestAnimationFrame(frame);
}

addEventListener('resize', sizeCanvas, { passive: true });
function aimPointer(e, snap) {
  ptr.tx = e.clientX; ptr.ty = e.clientY;
  /* First contact lands the light where it is, instead of letting it streak
     in from off-screen. */
  if (snap || ptr.x < -900) { ptr.x = e.clientX; ptr.y = e.clientY; }
  ptr.active = true;
}

addEventListener('pointermove', (e) => aimPointer(e, false), { passive: true });
addEventListener('pointerleave', () => { ptr.active = false; }, { passive: true });

/* A finger is a pointer too. Touch gets the light on contact — so a single
   tap lights the sky, not just a drag — and releases it on lift, where the
   eased intensity carries it out gently. A mouse keeps its old behaviour:
   present as long as it is over the page. */
addEventListener('pointerdown', (e) => {
  if (e.pointerType !== 'mouse') aimPointer(e, true);
}, { passive: true });
addEventListener('pointerup', (e) => {
  if (e.pointerType !== 'mouse') ptr.active = false;
}, { passive: true });
addEventListener('pointercancel', () => { ptr.active = false; }, { passive: true });

addEventListener('touchmove', (e) => {
  const t = e.touches[0]; if (!t) return;
  tilt.tx = (t.clientX / innerWidth - 0.5) * 1.1;
  tilt.ty = (t.clientY / innerHeight - 0.5) * 1.1;
}, { passive: true });

function enableTilt() {
  addEventListener('deviceorientation', (e) => {
    if (e.gamma == null) return;
    tilt.tx = Math.max(-1, Math.min(1, e.gamma / 34));
    tilt.ty = Math.max(-1, Math.min(1, ((e.beta || 45) - 45) / 34));
  }, { passive: true });
}
if (typeof DeviceOrientationEvent !== 'undefined' &&
    typeof DeviceOrientationEvent.requestPermission !== 'function') enableTilt();

/* ══════════════════════════ the constellation ══════════════════════════ */
const skel = $('skeleton');
const groups = [];

function buildSkeleton() {
  LETTERS.forEach((L) => {
    const g = document.createElementNS(NS, 'g');
    const lines = [], nodes = [];

    L.seg.forEach(([a, b]) => {
      const p1 = L.pts[a], p2 = L.pts[b];
      const ln = document.createElementNS(NS, 'line');
      ln.setAttribute('class', 'sk-line');
      ln.setAttribute('x1', p1[0]); ln.setAttribute('y1', p1[1]);
      ln.setAttribute('x2', p2[0]); ln.setAttribute('y2', p2[1]);
      const len = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]);
      ln.style.setProperty('--len', len.toFixed(2));
      g.appendChild(ln); lines.push(ln);
    });

    L.pts.forEach((p) => {
      const n = document.createElementNS(NS, 'g');
      n.setAttribute('class', 'sk-node');
      const halo = document.createElementNS(NS, 'circle');
      halo.setAttribute('class', 'sk-halo');
      halo.setAttribute('cx', p[0]); halo.setAttribute('cy', p[1]); halo.setAttribute('r', 3.6);
      const core = document.createElementNS(NS, 'circle');
      core.setAttribute('class', 'sk-core');
      core.setAttribute('cx', p[0]); core.setAttribute('cy', p[1]); core.setAttribute('r', 1.05);
      n.appendChild(halo); n.appendChild(core);
      g.appendChild(n); nodes.push(n);
    });

    skel.appendChild(g);
    groups.push({ lines, nodes });
  });
}

/* ══════════════════════════ personal constellation ══════════════════════════ */
function buildPersonal(svg) {
  svg.textContent = '';
  const links = [], nodes = [];
  PLINKS.forEach(([a, b]) => {
    const p1 = PERSONAL[a], p2 = PERSONAL[b];
    const ln = document.createElementNS(NS, 'line');
    ln.setAttribute('class', 'pg-link');
    ln.setAttribute('x1', p1[0]); ln.setAttribute('y1', p1[1]);
    ln.setAttribute('x2', p2[0]); ln.setAttribute('y2', p2[1]);
    ln.style.setProperty('--len', Math.hypot(p2[0] - p1[0], p2[1] - p1[1]).toFixed(2));
    svg.appendChild(ln); links.push(ln);
  });
  PERSONAL.forEach((p) => {
    const n = document.createElementNS(NS, 'g');
    n.setAttribute('class', 'pg-node');
    const halo = document.createElementNS(NS, 'circle');
    halo.setAttribute('class', 'pg-halo');
    halo.setAttribute('cx', p[0]); halo.setAttribute('cy', p[1]); halo.setAttribute('r', 9);
    const core = document.createElementNS(NS, 'circle');
    core.setAttribute('class', 'pg-core');
    core.setAttribute('cx', p[0]); core.setAttribute('cy', p[1]); core.setAttribute('r', 2.1);
    n.appendChild(halo); n.appendChild(core);
    svg.appendChild(n); nodes.push(n);
  });
  return { links, nodes };
}

const pg = buildPersonal($('progress'));
const fin = buildPersonal($('finalMark'));

/* ══════════════════════════ the opening sequence ══════════════════════════ */
let introDone = false;   /* the chrome is up */
let revealDone = false;  /* every last word has settled */

/* Set text as individually revealable words. Arabic shaping is unaffected —
   letters only join inside a word, never across a space. */
function setWords(el, str) {
  el.textContent = '';
  const frag = document.createDocumentFragment();
  str.split('\n').forEach((line, li) => {
    if (li) frag.appendChild(document.createElement('br'));
    line.split(/\s+/).filter(Boolean).forEach((word, wi) => {
      if (wi) frag.appendChild(document.createTextNode(' '));
      const sp = document.createElement('span');
      sp.className = 'w';
      sp.textContent = word;
      frag.appendChild(sp);
    });
  });
  el.appendChild(frag);
  if (el.dataset.settled === '1') showWords(el);
}

function showWords(el) {
  el.dataset.settled = '1';
  el.querySelectorAll('.w').forEach((w) => w.classList.add('in'));
}

/* Words arrive slowly at first and gather pace — the invitation opens the way
   someone reads it aloud. `quicken` shortens each successive gap. */
function revealWords(el, at, gap, quicken) {
  const ws = el.querySelectorAll('.w');
  let t = at;
  ws.forEach((w, i) => {
    later(() => w.classList.add('in'), t);
    t += Math.max(gap - i * (quicken || 0), gap * 0.4);
  });
  later(() => { el.dataset.settled = '1'; }, t);
  return t;
}

const WORDED = ['heroEn', 'heroAr', 'verse', 'dDate', 'dPlace', 'dDressLab', 'dDress', 'rsvpBy'];
const BLOCKS = ['rule1', 'countdown', 'beginBtn'];

/* The invitation copy is laid out but invisible during the intro, which would
   push the constellation to the top of the screen. Hold the mark at the optical
   centre while it draws, then let it rise into its real place as the copy
   arrives — the lift is the transition between the two moments. */
const markEl = $('mark');
function holdMarkCentre() {
  const r = markEl.getBoundingClientRect();
  if (!r.height) return;
  const d = (innerHeight / 2) - (r.top + r.height / 2);
  markEl.style.transition = 'none';
  markEl.style.transform = 'translateY(' + d.toFixed(1) + 'px) scale(1.045)';
  void markEl.offsetWidth;
}
function releaseMark() {
  markEl.style.transition = 'transform 1.75s var(--ease)';
  markEl.style.transform = 'translateY(0) scale(1)';
}

function revealContent(from) {
  later(releaseMark, from - 260);

  let t = revealWords($('heroEn'), from, 260, 18);
  t = revealWords($('heroAr'), t + 180, 200, 14);
  later(() => $('rule1').classList.add('in'), t + 40);
  t = revealWords($('verse'), t + 320, 105, 4);
  t = revealWords($('dDate'), t + 250, 66);
  t = revealWords($('dPlace'), t + 80, 56);
  t = revealWords($('dDressLab'), t + 80, 50);
  t = revealWords($('dDress'), t, 50);
  later(() => $('countdown').classList.add('in'), t + 100);
  t = revealWords($('rsvpBy'), t + 170, 44);
  later(() => $('beginBtn').classList.add('in'), t + 130);
  later(settle, t + 420);
}

/* The reveal owns the screen while it runs: Skip is the only control, and the
   language toggle only appears once there is nothing left to interrupt. */
function settle() {
  revealDone = true;
  introDone = true;
  $('chrome').classList.add('in');
  $('skipBtn').classList.remove('in');
}

function finishIntro() {
  if (revealDone) return;
  clearAll();
  releaseMark();
  groups.forEach((g) => {
    g.nodes.forEach((n) => n.classList.add('lit'));
    g.lines.forEach((l) => l.classList.add('drawn'));
  });
  skel.classList.add('faded');
  $('realmark').classList.add('shown');
  WORDED.forEach((id) => showWords($(id)));
  BLOCKS.forEach((id) => $(id).classList.add('in'));
  settle();
}

function litSky() { requestAnimationFrame(() => cv.classList.add('lit')); }

function playIntro() {
  $('stInvite').classList.add('on');
  litSky();

  if (reduce) { finishIntro(); return; }

  holdMarkCentre();
  $('skipBtn').classList.add('in');

  /* the first letters are drawn slowly, the last ones flow */
  const START = 1500;
  let at = START;
  groups.forEach((g, i) => {
    g.nodes.forEach((n, k) => later(() => n.classList.add('lit'), at + k * 62));
    g.lines.forEach((l, k) => later(() => l.classList.add('drawn'), at + 330 + k * 70));
    at += Math.max(880 - i * 62, 480);
  });

  const end = at + 820;
  later(() => { skel.classList.add('faded'); $('realmark').classList.add('shown'); }, end);
  revealContent(end + 1000);
}

/* ══════════════════════════ stages ══════════════════════════ */
let stage = 'invite';
function goStage(name) {
  const map = { invite: 'stInvite', form: 'stForm', done: 'stDone' };
  const from = $(map[stage]), to = $(map[name]);
  if (from === to) return;
  from.classList.add('out'); from.classList.remove('on');
  later(() => from.classList.remove('out'), 900);
  later(() => {
    to.classList.add('on');
    if (name === 'form') { paintStep(); focusStep(); }
  }, 620);
  stage = name;
}

/* ══════════════════════════ the form ══════════════════════════ */
const answers = { name: '', mobile: '', email: '', attending: null };
const KEYS = ['name', 'mobile', 'email', 'attending'];
let step = 0;

const input = $('fInput'), choicesEl = $('fChoices'), errEl = $('fErr');

function stepDef() { return COPY[lang].steps[step]; }

function paintStep() {
  const s = stepDef(), c = COPY[lang];
  $('fLabel').textContent = s.label;
  errEl.classList.remove('show');
  $('fBack').hidden = step === 0;
  $('fBack').textContent = c.back;

  document.querySelector('.f-nav').classList.toggle('solo', s.type === 'choice');

  const field = $('form');
  field.classList.remove('enter');
  void field.offsetWidth;
  field.classList.add('enter');

  if (s.type === 'choice') {
    input.hidden = true; choicesEl.hidden = false; $('fNext').hidden = true;
    choicesEl.textContent = '';
    s.options.forEach((o) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'choice'; b.textContent = o.t;
      b.addEventListener('click', () => { answers.attending = o.v; ignite(3); later(submit, 620); });
      choicesEl.appendChild(b);
    });
  } else {
    input.hidden = false; choicesEl.hidden = true; $('fNext').hidden = false;
    $('fNext').textContent = c.next;
    input.type = s.type; input.setAttribute('autocomplete', s.ac);
    input.setAttribute('inputmode', s.im); input.setAttribute('autocapitalize', s.cap);
    input.value = answers[KEYS[step]] || '';
  }
}

function focusStep() {
  if (stepDef().type !== 'choice') later(() => input.focus({ preventScroll: true }), 420);
}

/* Each answered field lights its star and reaches a line back to the last one,
   so the guest watches their own constellation form as they fill the form. */
function ignite(i) {
  pg.nodes[i].classList.add('lit');
  if (i > 0) later(() => pg.links[i - 1].classList.add('drawn'), 220);
}
function dim(i) {
  pg.nodes[i].classList.remove('lit');
  if (i > 0) pg.links[i - 1].classList.remove('drawn');
}

function validate() {
  const v = input.value.trim(), c = COPY[lang];
  if (step === 0) { if (v.length < 2) return c.err.name; }
  if (step === 1) { if ((v.match(/\d/g) || []).length < 7) return c.err.tel; }
  if (step === 2) { if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) return c.err.email; }
  return null;
}

$('form').addEventListener('submit', (e) => {
  e.preventDefault();
  const bad = validate();
  if (bad) { errEl.textContent = bad; errEl.classList.add('show'); input.focus(); return; }
  answers[KEYS[step]] = input.value.trim();
  ignite(step);
  step++; paintStep(); focusStep();
});

$('fBack').addEventListener('click', () => {
  if (step === 0) return;
  step--; dim(step); paintStep(); focusStep();
});

/* ══════════════════════════ submit ══════════════════════════ */
function submit() {
  const c = COPY[lang], coming = answers.attending === 'yes';

  const payload = {
    name: answers.name,
    mobile: answers.mobile,
    email: answers.email,
    attending: answers.attending,
    language: lang,
    submittedAt: new Date().toISOString()
  };
  window.JAYASOM_RSVP = payload;
  send(payload);

  $('doneEn').textContent = coming ? c.doneA : c.noA;
  $('doneAr').textContent = coming ? c.doneB : c.noB;
  $('doneVerse').textContent = coming ? c.doneVerse : c.noVerse;
  $('calBtn').textContent = c.cal;
  $('calBtn').hidden = !coming;

  fin.nodes.forEach((n) => n.classList.add('lit'));
  goStage('done');
  later(() => {
    fin.links.forEach((l, i) => later(() => l.classList.add('drawn'), i * 260));
  }, 900);
  ['doneEn', 'doneAr', 'doneRule', 'doneVerse', 'calBtn'].forEach((id, i) =>
    later(() => $(id).classList.add('in'), 1500 + i * 200));
}

/* ══════════════════════════ sending ══════════════════════════ */
/* Kept deliberately quiet: a guest is never shown a technical error on an
   invitation. Failures are recorded on the page for diagnosis instead, which is
   why the first live RSVP must be checked at the destination before the link
   goes out. */
function send(payload) {
  const data = {};
  Object.keys(RSVP.fields).forEach((k) => {
    let v = payload[k];
    if (k === 'attending' && RSVP.attendingValue) v = RSVP.attendingValue[v] || v;
    data[RSVP.fields[k]] = v == null ? '' : String(v);
  });
  Object.assign(data, RSVP.extra || {});

  window.JAYASOM_SENT = data;

  try {
    if (RSVP.mode === 'json') {
      fetch(RSVP.endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).then((r) => { window.JAYASOM_SEND_OK = r.ok; })
        .catch((e) => { window.JAYASOM_SEND_ERR = String(e); });
      return;
    }

    /* A real form POST into a hidden iframe: no cross-origin preflight, and it
       survives the page being closed the instant the guest is done. */
    let frame = document.getElementById('rsvpSink');
    if (!frame) {
      frame = document.createElement('iframe');
      frame.id = 'rsvpSink';
      frame.name = 'rsvpSink';
      frame.setAttribute('aria-hidden', 'true');
      frame.style.cssText = 'position:absolute;width:0;height:0;border:0;left:-9999px';
      document.body.appendChild(frame);
    }
    const form = document.createElement('form');
    form.method = 'POST';
    form.action = RSVP.endpoint;
    form.target = 'rsvpSink';
    form.style.display = 'none';
    form.acceptCharset = 'utf-8';
    Object.keys(data).forEach((k) => {
      const i = document.createElement('input');
      i.type = 'hidden'; i.name = k; i.value = data[k];
      form.appendChild(i);
    });
    document.body.appendChild(form);
    form.submit();
    later(() => form.remove(), 4000);
    window.JAYASOM_SEND_OK = true;
  } catch (e) {
    window.JAYASOM_SEND_ERR = String(e);
  }
}

/* ══════════════════════════ decline path ══════════════════════════ */
/* handled inside submit() — the closing simply changes voice. */

/* ══════════════════════════ countdown ══════════════════════════ */
const AR_DIGITS = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
const num = (n) => {
  const s = String(n);
  return lang === 'ar' ? s.replace(/\d/g, (d) => AR_DIGITS[+d]) : s;
};

function tickCountdown() {
  const ms = EVENT_AT - Date.now();
  if (ms <= 0) { $('countdown').style.display = 'none'; return; }
  const m = Math.floor(ms / 60000);
  $('cdD').textContent = num(Math.floor(m / 1440));
  $('cdH').textContent = num(Math.floor(m / 60) % 24);
  $('cdM').textContent = num(m % 60);
}

/* ══════════════════════════ calendar ══════════════════════════ */
$('calBtn').addEventListener('click', () => {
  const dt = (d) => d.toISOString().replace(/[-:]|\.\d{3}/g, '');
  const end = new Date(EVENT_AT.getTime() + 4 * 3600 * 1000);
  const url = 'https://calendar.google.com/calendar/render?action=TEMPLATE'
    + '&text=' + encodeURIComponent('Jayasom · AMAALA')
    + '&dates=' + dt(EVENT_AT) + '/' + dt(end)
    + '&location=' + encodeURIComponent('Jayasom, AMAALA, Red Sea')
    + '&details=' + encodeURIComponent('A New Constellation Begins.');
  window.open(url, '_blank', 'noopener');
});

/* ══════════════════════════ copy ══════════════════════════ */
/* Paints the (English-default, Arabic-mixed) copy into the page once at
   startup. There is no language toggle — English is the only mode, with
   Arabic lines kept in deliberately alongside it. */
function applyLang() {
  const c = COPY[lang];
  document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
  document.documentElement.setAttribute('lang', lang);

  $('skipBtn').textContent = c.skip;
  setWords($('heroEn'), c.heroA);
  setWords($('heroAr'), c.heroB);
  setWords($('verse'), c.verse);
  setWords($('dDate'), c.date);
  setWords($('dPlace'), c.place);
  setWords($('dDressLab'), c.dressLab);
  setWords($('dDress'), c.dress);
  $('cdDL').textContent = c.cdD;
  $('cdHL').textContent = c.cdH;
  $('cdML').textContent = c.cdM;
  setWords($('rsvpBy'), c.rsvpBy);
  $('beginBtn').textContent = c.begin;
  $('calBtn').textContent = c.cal;
  tickCountdown();

  /* repaint the form in the new language without losing what is half-typed */
  const pending = stepDef().type === 'choice' ? null : input.value;
  paintStep();
  if (pending) input.value = pending;
}

/* ══════════════════════════ wiring ══════════════════════════ */
$('beginBtn').addEventListener('click', () => {
  /* iOS 13+ Safari only grants tilt access from inside a real tap, and only
     once — "Begin" is the first deliberate tap a guest makes, so ask here
     instead of leaving iPhone guests with no tilt parallax at all. Silent
     no-op everywhere else (Android/desktop already enabled tilt earlier). */
  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission().then((state) => {
      if (state === 'granted') enableTilt();
    }).catch(() => {});
  }
  spawnShooter();
  goStage('form');
});

$('skipBtn').addEventListener('click', finishIntro);
addEventListener('keydown', (e) => {
  if (!revealDone && (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape')) finishIntro();
});
addEventListener('wheel', () => { if (!revealDone) finishIntro(); }, { passive: true, once: true });

/* ══════════════════════════ start ══════════════════════════ */
sizeCanvas();
requestAnimationFrame(frame);
buildSkeleton();
applyLang();
paintStep();
tickCountdown();
setInterval(tickCountdown, 20000);

/* The reveal plays in full every time — it is the piece, not an onboarding step.
   Only a direct link to the form skips it. */
const direct = /(^|[?#&])rsvp\b/.test(location.hash + location.search);

if (direct) {
  litSky();
  finishIntro();
  $('stInvite').classList.add('on');
  goStage('form');
} else {
  playIntro();
}

})();

</script>
</body>
</html>
